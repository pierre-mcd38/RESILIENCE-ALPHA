# ==============================================================================
# PROJECT RESILIENCE-ALPHA — Règles d'Inspection WAF L7 Statiques & Dynamiques
# Référence : infra/waf/modsecurity-rules.conf
#
# Note d'architecture (Section 6 de docs/architecture.md) :
# - Ces règles bloquent immédiatement (HTTP 403) les attaques par signatures :
#   SQL Injection (SQLi), Cross-Site Scripting (XSS), Path Traversal, Command Injection.
# - Le scénario principal d'épuisement applicatif L7 sur /api/v1/transactions/verify-batch
#   utilise des charges JSON syntaxiquement légitimes qui franchissent ces règles
#   statiques mais sont détectées en temps réel par le moteur ML IsolationForest,
#   puis bloquées via la liste dynamique (dynamic-blocklist).
# ==============================================================================

# Rule 1001 : Détection SQL Injection (UNION SELECT, OR 1=1, commentaires SQL)
SecRule REQUEST_URI|ARGS|REQUEST_BODY "@rx (?i)(\bunion\s+all\s+select\b|\bunion\s+select\b|\bor\s+1\s*=\s*1\b|--\s*$|;\s*drop\s+table)" \
    "id:1001,phase:2,deny,status:403,log,msg:'RESILIENCE-WAF: SQL Injection signature blocked'"

# Rule 1002 : Détection Cross-Site Scripting (XSS)
SecRule REQUEST_URI|ARGS|REQUEST_BODY "@rx (?i)(<script\b[^>]*>|javascript:|onerror\s*=|onload\s*=)" \
    "id:1002,phase:2,deny,status:403,log,msg:'RESILIENCE-WAF: XSS signature blocked'"

# Rule 1003 : Détection Path Traversal (../, ..\ et variantes encodées)
SecRule REQUEST_URI|ARGS "@rx (?i)(\.\./|\.\.\\|%2e%2e%2f|%2e%2e\\)" \
    "id:1003,phase:1,deny,status:403,log,msg:'RESILIENCE-WAF: Path Traversal signature blocked'"

# Rule 1004 : Détection Command Injection Shell
SecRule ARGS|REQUEST_BODY "@rx (;\s*/bin/sh|\|\s*bash|`[^`]+`|\$\([^\)]+\))" \
    "id:1004,phase:2,deny,status:403,log,msg:'RESILIENCE-WAF: OS Command Injection signature blocked'"
