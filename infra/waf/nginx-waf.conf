# ==============================================================================
# PROJECT RESILIENCE-ALPHA — Configuration Reverse Proxy & WAF Périphérique
# Référence : infra/waf/nginx-waf.conf
# ==============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    # Format de journalisation structuré JSON pour corrélation SOC & Loki
    log_format soc_json escape=json
      '{'
        '"timestamp":"$time_iso8601",'
        '"correlation_id":"$http_x_correlation_id",'
        '"source_ip":"$remote_addr",'
        '"method":"$request_method",'
        '"path":"$uri",'
        '"status_code":$status,'
        '"latency_ms":$request_time,'
        '"user_agent":"$http_user_agent"'
      '}';

    access_log /var/log/nginx/access.log soc_json;

    # Zones de limitation de débit (Rate Limiting L7)
    limit_req_zone $binary_remote_addr zone=normal_profile:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=strict_mitigation:10m rate=5r/s;

    upstream payment_api_upstream {
        server api:8001 max_fails=3 fail_timeout=5s;
        keepalive 16;
    }

    upstream auth_service_upstream {
        server auth:8002 max_fails=3 fail_timeout=5s;
        keepalive 8;
    }

    upstream soc_remediator_upstream {
        server remediator:8004;
    }

    upstream rag_assistant_upstream {
        server rag:8006;
    }

    server {
        listen 8080;
        server_name _;

        # En-têtes de durcissement HTTP
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer" always;

        # Inclusion des règles statiques et de la blocklist dynamique gérée par Executor
        include /etc/resilience-waf/modsecurity-rules.conf;

        location /health {
            access_log off;
            return 200 '{"status":"ok","service":"waf-gateway"}';
        }

        location /auth/ {
            limit_req zone=normal_profile burst=20 nodelay;
            proxy_pass http://auth_service_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/ {
            limit_req zone=normal_profile burst=30 nodelay;
            proxy_pass http://payment_api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /soc/ {
            proxy_pass http://soc_remediator_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /rag/ {
            proxy_pass http://rag_assistant_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
