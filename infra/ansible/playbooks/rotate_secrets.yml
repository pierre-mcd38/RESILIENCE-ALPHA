---
# ==============================================================================
# Playbook : rotate_secrets.yml
# Rôle : Automatiser la rotation cryptographique des secrets applicatifs (JWT,
#        HMAC Executor, mots de passe techniques) via scripts/secrets_manager.py
#        et vérifier qu'aucun secret en clair n'est exposé dans le dépôt.
# ==============================================================================
- name: "Rotation Sécurisée des Secrets Cryptographiques (SOPS + Age)"
  hosts: resilience_host
  gather_facts: false
  vars:
    repo_root: "{{ playbook_dir }}/../../.."
    secrets_script: "{{ repo_root }}/scripts/secrets_manager.py"
    scan_script: "{{ repo_root }}/scripts/secret_scan.py"
  tasks:
    - name: "1. Exécuter la rotation des secrets dans le coffre chiffré (infra/secrets/secrets.enc.json)"
      ansible.builtin.command:
        cmd: "python {{ secrets_script }} rotate"
        chdir: "{{ repo_root }}"
      register: rotate_out
      changed_when: "'ROTATED' in rotate_out.stdout"

    - name: "2. Vérifier le déchiffrement et l'intégrité AEAD (AES-256-GCM) après rotation"
      ansible.builtin.command:
        cmd: "python {{ secrets_script }} verify"
        chdir: "{{ repo_root }}"
      changed_when: false

    - name: "3. Exécuter le scanner statique de fuites de secrets sur l'ensemble du dépôt"
      ansible.builtin.command:
        cmd: "python {{ scan_script }}"
        chdir: "{{ repo_root }}"
      changed_when: false
