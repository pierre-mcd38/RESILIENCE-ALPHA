apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus_ds
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "2s"

  - name: Loki
    type: loki
    uid: loki_ds
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: false
