; PlatformIO Project Configuration File for JetBrains CLion
; Project RESILIENCE-ALPHA — Biometric Authentication ESP8266 Bi-color LED
; Target: WeMos D1 Mini / ESP-12F (ESP8266EX, 4MB Flash)

[platformio]
default_envs = d1_mini

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
upload_port = COM6
upload_speed = 921600
monitor_port = COM6
monitor_speed = 115200

build_flags = 
    -D LED_GREEN_PIN=4   ; D2 (GPIO4)
    -D LED_RED_PIN=5     ; D1 (GPIO5)
    -D LED_COMMON_CATHODE=1 ; 1 = Common Cathode (HIGH=ON), 0 = Common Anode (LOW=ON)

lib_deps =
    ESP8266WiFi
    ESP8266WebServer
    ArduinoJson
